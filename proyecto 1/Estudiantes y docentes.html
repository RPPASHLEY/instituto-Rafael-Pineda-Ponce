        /* Estilos del menú */
        .menu {
            list-style: none;
            padding: 20px;
            display: flex;
            gap: 100px;
            background: linear-gradient(190deg,#ff00fb, #fb91ed);
            box-shadow: 10px 15px 8px #f084f4;

        }

        .menu li {
            position: relative;
            background: #e545bf;
            padding: 15px;
            color: rgb(8, 7, 7);
            cursor: pointer;
            border-radius: 20px;
            transition: background-color 0.3s ease;
        }

        .menu li:hover {
            background-color: #f18bdb;
        }

        .submenu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: rgb(232, 172, 199);
            color: rgba(15, 15, 16, 0.9);
            border: 5px solid #d157a6;
            border-radius: 10px;
        }

        .submenu table {
            border-collapse: collapse;
            width: 100%;
        }

        .submenu td, .submenu th {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        .menu li:hover .submenu {
            display: block;
        }

        .button {
            padding: 10px 20px;
            background-color: #be1fc1;
            color: white;
            border: none;
            border-radius: 5px;
            border-radius: 30px;
            border-radius: 30px;
      box-shadow: 10px 15px 8px #f084f4;

            text-decoration: none;
            margin-top: 10px;
            display: inline-block;
            text-align: center;
        }

        .button:hover {

        }
    </style>
</head>
