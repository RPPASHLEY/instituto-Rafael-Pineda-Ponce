<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Programas Educativos</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #e8eef3;
      margin: 0;
      padding: 40px;
      color: #333;
    }

    h1 {
      color: #1a2d4d;
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 40px;
    }

    .bloque {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 40px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.07);
    }

    .bloque h2 {
      font-size: 1.6rem;
      margin-bottom: 20px;
      color: #2e3c50;
      border-left: 6px solid #4e8ad1;
      padding-left: 12px;
    }
    .bloque ul {
      margin: 0;
      padding-left: 20px;
      list-style-type: circle;
    }

    .bloque li {
      margin-bottom: 10px;
    }

    .carrera-lista {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 20px;
    }

    .carrera-item {
      background-color: #f7f9fb;
      padding: 15px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      width: calc(50% - 10px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .carrera-item img {
      width: 65px;
      height: 65px;
      border-radius: 10px;
      object-fit: cover;
      margin-right: 15px;
    }
    .volver-btn {
      display: block;
      text-align: center;
      margin-top: 30px;
      background-color: #fa85e7;
      color: white;
      padding: 12px 25px;
      text-decoration: none;
      border-radius: 30px;
      box-shadow: 10px 15px 8px #f084f4;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .volver-btn:hover {
      background-color: #f150ef;
    }

    @media screen and (max-width: 768px) {
      .carrera-item {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <h1>Programas Educativos</h1>

  <div class="bloque">
    <h2>Módulos Disponibles</h2>
    <ul>
      <li>Madera</li>
      <li>Corte y Confección</li>
      <li>Soldadura Eléctrica</li>
    </ul>
    <p><strong>Niveles aplicables:</strong> 7º, 8º y 9º grado.</p>
  </div>

  <div class="bloque">
    <h2>Especialidades Técnicas</h2>
    <div class="carrera-lista">
      <div class="carrera-item">
        <img src="USO1 .jpg" alt="Informática">
        <span>Informática</span>
      </div>
      <div class="carrera-item">
        <img src="USO2.jpg" alt="Estructuras Metálicas">
        <span>Estructuras Metálicas</span>
      </div>
      <div class="carrera-item">
        <img src="USO3.jpg" alt="Electricidad">
        <span>Electricidad</span>
      </div>
      <div class="carrera-item">
        <img src="imajen de HOTELERA.jpeg" alt="Hotelera">
        <span>Hotelera</span>
      </div>
    </div>
    <p style="margin-top: 20px;"><strong>Niveles aplicables:</strong> 11º y 12º grado.</p>
  </div>

  <a class="volver-btn" href="file:///C:/Users/ashle/OneDrive/Desktop/proyecto%201/INDEX.html">← Regresar al inicio</a>

</body>
</html>
