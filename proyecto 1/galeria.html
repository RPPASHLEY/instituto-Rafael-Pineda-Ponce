<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galería Completa y Compacta</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
    text-align: center;
  }
  h1 { color: #333; margin-bottom: 20px; }

  /* Grid de miniaturas pequeñas, todas visibles lado a lado */
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 10px;
    max-width: 1000px;
    margin: 0 auto 20px;
  }
  .gallery-item {
    overflow: hidden;
    border-radius: 8px;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s;
  }
  .gallery-item img {
    width: 100%;
    height: auto;
    display: block;
    transition: transform .2s;
  }
  .gallery-item:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 8px rgba(0,0,0,0.15);
  }
  .gallery-item:hover img {
    transform: scale(1.1);
  }

  /* Overlay fullscreen */
  .fullscreen-view {
    position: fixed; top:0; left:0;
    width: 100%; height:100%;
    background: rgba(0,0,0,0.8);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }
  .fullscreen-view img {
    max-width: 90%;
    max-height: 80%;
    border-radius: 10px;
  }
  .close-btn {
    position: absolute; top:20px; right:30px;
    padding:8px 12px;
    background:#ff3333; color:#fff;
    border:none; border-radius:4px;
    cursor:pointer;
  }
  .close-btn:hover {
    background:#cc0000;
  }

  /* Navegación siempre visible */
  .fullscreen-nav {
    position: fixed;
    top:50%;
    width:100%;
    display:flex;
    justify-content: space-between;
    pointer-events: none;
    z-index:1001;
  }
  .fullscreen-nav button {
    pointer-events: all;
    padding:8px 16px;
    background: rgba(0,123,255,0.8);
    color:#fff;
    border:none;
    border-radius:4px;
    cursor:pointer;
    font-size:14px;
    transition: background .2s;
  }
  .fullscreen-nav button:hover {
    background: rgba(0,123,255,1);
  }

  .back-button {
    margin-top: 30px;
  }
  .back-button a {
    padding: 8px 16px;
    background: #28a745;
    color: #fff;
    text-decoration: none;
    border-radius: 4px;
    font-weight: bold;
  }
  .back-button a:hover {
    background: #218838;
  }
</style>
</head>
<body>

<h1>Galería Completa</h1>
<div class="gallery-grid" id="galleryGrid"></div>

<div class="fullscreen-view" id="fullscreenView">
  <button class="close-btn" onclick="closeFullscreen()">Cerrar ✖</button>
  <img id="fullscreenImg" src="" alt="Imagen completa">
</div>
<div class="fullscreen-nav" id="fullscreenNav">
  <button onclick="changeImage(-1)">← Anterior</button>
  <button onclick="changeImage(1)">Siguiente →</button>
</div>

<div class="back-button">
  <a href="INDEX.html">← Volver al Inicio</a>
</div>

<script>
  const images = Array.from({length:15}, (_,i) => `usu${i+1}.jpeg`);
  let currentImage = 0;

  const grid = document.getElementById('galleryGrid');
  images.forEach((src, idx) => {
    const div = document.createElement('div');
    div.className = 'gallery-item';
    div.onclick = () => openFullscreen(idx);
    const img = document.createElement('img');
    img.src = src;
    img.alt = `Imagen ${idx+1}`;
    div.appendChild(img);
    grid.appendChild(div);
  });

  function openFullscreen(idx) {
    currentImage = idx;
    document.getElementById('fullscreenImg').src = images[idx];
    document.getElementById('fullscreenView').style.display = 'flex';
    document.getElementById('fullscreenNav').style.display = 'flex';
  }

  function closeFullscreen() {
    document.getElementById('fullscreenView').style.display = 'none';
    document.getElementById('fullscreenNav').style.display = 'none';
  }

  function changeImage(dir) {
    currentImage = (currentImage + dir + images.length) % images.length;
    document.getElementById('fullscreenImg').src = images[currentImage];
  }
</script>


<a class="volver-btn" href="file:///C:/Users/ashle/OneDrive/Desktop/proyecto%201/INDEX.html">← Regresar al inicio</a>
</body>
</html>
